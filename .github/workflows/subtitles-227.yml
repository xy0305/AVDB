name: Build227 Three Subtitle Sources
on:
  push:
    branches: [fix/subtitle-position-201]
    paths: ['AVDB/Views/Player/**', 'UITests/**', 'scripts/ChickenRiceRegression.swift', '.github/workflows/subtitles-227.yml']
permissions:
  contents: read
concurrency:
  group: subtitles-227-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    runs-on: macos-26
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        device: [iPhone, iPad]
    steps:
      - uses: actions/checkout@v4
      - name: Production Swift regressions and dependencies
        run: |
          CHICKEN_LIVE_PROBE=${{ matrix.device == 'iPhone' && github.run_number == '3' && '1' || '0' }} python3 scripts/test-online-subtitles.py
          gem install cocoapods -v 1.16.2 --no-document
          ruby scripts/setup-poster-uitests.rb
          pod install --repo-update
          xcrun simctl list devices available -j > "$RUNNER_TEMP/devices.json"
          python3 - <<'PY'
          import json,os
          ds=json.load(open(os.environ['RUNNER_TEMP']+'/devices.json'))['devices']
          d=next(d for group in ds.values() for d in group if '${{ matrix.device }}' in d['name'])
          with open(os.environ['GITHUB_ENV'],'a') as f: f.write('DEVICE_ID='+d['udid']+'\n')
          print(d['name'],d['udid'])
          PY
          xcrun simctl boot "$DEVICE_ID" || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcrun -sdk iphonesimulator metal -fcikernel -c AVDB/Resources/Enhancement.metal -o "$RUNNER_TEMP/Enhancement.air"
          xcrun -sdk iphonesimulator metallib -cikernel "$RUNNER_TEMP/Enhancement.air" -o AVDB/Resources/Enhancement.metallib
      - name: Neutral real player third-source settings and selection
        run: |
          set -o pipefail
          xcodebuild test -workspace AVDB.xcworkspace -scheme PosterNavigation -configuration Debug -destination "platform=iOS Simulator,id=$DEVICE_ID" -derivedDataPath "$RUNNER_TEMP/SubDerived" -resultBundlePath "$RUNNER_TEMP/Subtitles.xcresult" CODE_SIGNING_ALLOWED=NO -parallel-testing-enabled NO -only-testing:PosterNavigationUITests/PosterNavigationTests/testChickenRiceThirdSourceManualSelection -only-testing:DetailPosterQualityTests/OnlineSubtitleModelTests 2>&1 | tee "$RUNNER_TEMP/subtitles.log"
      - name: Export native evidence
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/subtitle-evidence/attachments"
          if test -d "$RUNNER_TEMP/Subtitles.xcresult"; then
            xcrun xcresulttool export attachments --path "$RUNNER_TEMP/Subtitles.xcresult" --output-path "$RUNNER_TEMP/subtitle-evidence/attachments"
            xcrun xcresulttool get test-results summary --path "$RUNNER_TEMP/Subtitles.xcresult" --format json > "$RUNNER_TEMP/subtitle-evidence/summary.json"
          fi
          cp "$RUNNER_TEMP/subtitles.log" "$RUNNER_TEMP/subtitle-evidence/" 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build227-native-subtitles-${{ matrix.device }}-${{ github.run_number }}
          path: ${{ runner.temp }}/subtitle-evidence/
          retention-days: 14
