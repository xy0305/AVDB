      - run: python3 scripts/test-zzt-ranking315.py
      - run: python3 scripts/test-zzt-ranking316.py
      - run: python3 scripts/test-zzt-ranking317.py
      - run: python3 scripts/test-zzt-ranking318.py
      - run: python3 scripts/test-zzt-ranking319.py
      - run: python3 scripts/test-zzt-ranking320.py
      - run: python3 scripts/test-zzt-ranking321.py
      - run: python3 scripts/test-zzt-ranking322.py
      - run: python3 scripts/test-player-chrome323.py
      - run: python3 scripts/test-home-hero-hq326.py
      - run: python3 scripts/test-detail-auth327.py
      - run: python3 scripts/test-home-hot328.py
      - run: python3 scripts/test-home-hot329.py
      - run: python3 scripts/test-home-chrome330.py
      - run: python3 scripts/test-home-hero331.py
      - run: python3 scripts/test-home-hero332.py
      - run: python3 scripts/test-home-hero333.py
      - run: python3 scripts/test-home-hero334.py
