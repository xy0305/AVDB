      - run: gem install xcodeproj --no-document
      - name: Production AICoverSettingsSection + hero (cloud hit from a local mock Worker / cloud-loading / 507 note) on simulator
        run: |
          set -o pipefail
          python3 scripts/test-ai-ui290.py 2>&1 | tee ai-ui290.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AVDB-344-ai-cover-cloud-screenshots
          path: |
            evidence-ai290ui/shots/*
            evidence-ai290ui/status.json
            ai-ui290.log
          if-no-files-found: warn
  live-ui-screenshots:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - run: gem install xcodeproj --no-document
      - name: Production live subtitle overlay / menu / settings / notices on simulator (portrait + landscape, neutral fixture)
        run: |
          set -o pipefail
          python3 scripts/test-live-ui287.py 2>&1 | tee live-ui287.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AVDB-344-live-subtitle-screenshots
          path: |
            evidence-live287/ui/shots/*
            evidence-live287/ui/status.json
            live-ui287.log
          if-no-files-found: warn
  app-integration:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: gem install cocoapods -v 1.16.2 --no-document
      - name: Compile production enhancement for real controller host
        run: |
          xcrun -sdk iphonesimulator metal -fcikernel -c AVDB/Resources/Enhancement.metal -o "$RUNNER_TEMP/Enhancement.air"
          xcrun -sdk iphonesimulator metallib -cikernel "$RUNNER_TEMP/Enhancement.air" -o AVDB/Resources/Enhancement.metallib
      - name: Actual NativeLUTController + KSAVPlayer + production cube on HTTP HLS
        run: python3 scripts/test-hls-app270.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AVDB-344-production-controller-HLS
          path: |
            evidence-hls-app/*.json
            evidence-hls-app/*.log
            evidence-hls-app/*.png
            evidence-hls-app/resolved-*
          if-no-files-found: warn
  strict-runtime:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - run: gem install xcodeproj --no-document
      - name: Compile same production runtime without DEBUG hooks
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          xcrun --sdk iphoneos swiftc -sdk "$SDK" -target arm64-apple-ios17.0 -O -parse-as-library -emit-module -module-name NativeHLSRuntime AVDB/Views/Player/NativeHLSLUTSurface.swift -o /tmp/NativeHLSRuntime.swiftmodule
      - name: Strict HLS LUT runtime on the simulator (Simulator.app opened so the display link runs; one retry for frame-pull starvation seen on runner image 20261026)
        run: |
          open -a Simulator || true
          sleep 5
          # 291: destination by simulator name (not UDID); open Simulator + bootstatus before each attempt.
          open -a Simulator || true
          xcrun simctl list devices available | head -40 || true
          python3 scripts/test-hls-runtime.py || { echo "::warning::strict-runtime attempt 1 failed — retrying once"; sleep 15; open -a Simulator || true; python3 scripts/test-hls-runtime.py; }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AVDB-344-strict-runtime
          path: |
            evidence-hls-runtime/*.json
            evidence-hls-runtime/*.log
            evidence-hls-runtime/*.png
          if-no-files-found: warn
  home-hq-simulator:
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - run: gem install xcodeproj --no-document
      - name: Visible poster upgrade on the iOS simulator (neutral rasters only)
        run: python3 scripts/test-home-hq-ui298.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AVDB-344-home-hq-simulator
          path: evidence-homehq298/*
          if-no-files-found: warn
  home-hero-hq-screenshots:
    # Build 326: production HomeView (neutral --home326-fixture 700×1000 B-tier rasters, no network)
    # on an iPhone simulator; screenshots of the full-bleed HQ hero and the rails.
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Simulator-only app setup (no live models; drop the device-only vendor xcframeworks — both are canImport-guarded)
        run: |
          set -euo pipefail
          mkdir -p AVDB/Resources/LiveModels
          gem install xcodeproj --no-document
          ruby -e 'require "xcodeproj"; p = Xcodeproj::Project.open("AVDB.xcodeproj"); app = p.targets.find { |t| t.name == "AVDB" }; app.build_phases.each { |ph| next unless ph.respond_to?(:files); ph.files.select { |f| f.file_ref && f.file_ref.path.to_s =~ /(llama|SherpaOnnxC)\.xcframework/ }.each { |f| puts "drop #{f.file_ref.path} from #{ph.display_name}"; ph.remove_build_file(f) } }; p.save'
      - name: Install dependencies and the generated PosterNavigation UI-test scheme
        run: |
          gem install cocoapods -v 1.16.2 --no-document
          ruby scripts/setup-poster-uitests.rb
          pod install --repo-update
      - name: Compile simulator Metal resource
        run: |
          xcrun -sdk iphonesimulator metal -fcikernel -c AVDB/Resources/Enhancement.metal -o "$RUNNER_TEMP/Enhancement.air"
          xcrun -sdk iphonesimulator metallib -cikernel "$RUNNER_TEMP/Enhancement.air" -o AVDB/Resources/Enhancement.metallib
      - name: Choose an iPhone simulator
        run: |
          xcrun simctl list devices available -j > devices.json
          python3 - <<'PY'
          import json,os
          devices=json.load(open('devices.json'))['devices']
          phones=[d for ds in devices.values() for d in ds if d['name'].startswith('iPhone')]
          assert phones, 'No available iPhone simulator'
          pref=[d for d in phones if 'Pro' in d['name'] and 'Max' not in d['name']]
          chosen=(pref or phones)[0]
          print(chosen)
          with open(os.environ['GITHUB_ENV'],'a') as f: f.write('IPHONE_UDID='+chosen['udid']+'\n')
          PY
      - name: Home 326 hero HQ screenshots (test326HomeHeroHQScreenshots)
        run: |
          set -o pipefail
          xcodebuild test -workspace AVDB.xcworkspace -scheme PosterNavigation -configuration Debug -destination "platform=iOS Simulator,id=$IPHONE_UDID" -derivedDataPath "$RUNNER_TEMP/HomeDerived" -resultBundlePath "$RUNNER_TEMP/Home326.xcresult" CODE_SIGNING_ALLOWED=NO -only-testing:PosterNavigationUITests/PosterNavigationTests/test326HomeHeroHQScreenshots 2>&1 | tee home326-ui.log | grep -E "error:|warning: .*HomeView|Test Case|passed|failed|BUILD" || true
          grep -q "Test Suite 'Selected tests' passed\|TEST SUCCEEDED" home326-ui.log
      - name: Export screenshots
        if: always()
        run: |
          mkdir -p evidence-home326
          if test -d "$RUNNER_TEMP/Home326.xcresult"; then
            xcrun xcresulttool export attachments --path "$RUNNER_TEMP/Home326.xcresult" --output-path evidence-home326 || true
          fi
          ls -la evidence-home326 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AVDB-344-home-screenshots
          path: |
            evidence-home326/*
            home326-ui.log
          if-no-files-found: warn

  detail-auth-327:
    # Build 327: detail-page token + visible auth errors (unit + UI, no live network)
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Simulator-only app setup (no live models; drop the device-only vendor xcframeworks — both are canImport-guarded)
        run: |
          set -euo pipefail
