    runs-on: macos-26
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/test-detail-api335.py
      - run: python3 scripts/test-remove-javverse336.py
      - run: python3 scripts/test-recommender-throttle337.py
      - run: python3 scripts/test-logout-access338.py
      - run: python3 scripts/test-clear-glass339.py
      - run: python3 scripts/test-session-revalidate340.py
      - run: python3 scripts/test-reviews-first-load341.py
      - run: python3 scripts/test-reviews-panel-pending342.py
      - run: python3 scripts/test-list-landscape-cover343.py
      - run: python3 scripts/test-list-tabbar-clearance344.py
  models:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Cache live-subtitle models (Whisper turbo/small Core ML + converted NLLB)
        id: cache
        uses: actions/cache@v4
        with:
          path: AVDB/Resources/LiveModels
          key: live287-models-v1-${{ hashFiles('scripts/live287/fetch_models287.py', 'scripts/live287/convert_nllb287.py') }}
      - uses: actions/setup-python@v5
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          python-version: '3.11'
      - name: Fetch Whisper models + tokenizers, convert NLLB-200 600M → Core ML int8, compile mlmodelc
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/venv" && source "$RUNNER_TEMP/venv/bin/activate"
          pip install -q torch==2.7.0 coremltools==9.0 transformers==4.46.3 sentencepiece==0.2.0 "huggingface_hub<1.0" "numpy<2.3"
          python scripts/live287/fetch_models287.py AVDB/Resources/LiveModels 2>&1 | tee fetch-models287.log
      - run: du -sh AVDB/Resources/LiveModels/* && cat AVDB/Resources/LiveModels/MODELS287.json
      - uses: actions/upload-artifact@v4
        with:
          name: live287-models
          path: AVDB/Resources/LiveModels
          compression-level: 0
          retention-days: 3
  release:
    needs: models
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: live287-models
          path: AVDB/Resources/LiveModels
      - name: Fetch sherpa-onnx iOS/macOS xcframeworks + SenseVoice-Small int8 (sha256-pinned); drop bundled turbo (on-demand in 289)
        run: |
          set -euo pipefail
          python3 scripts/live289/fetch_live289.py . AVDB/Resources/LiveModels 2>&1 | tee fetch-live289.log
          python3 scripts/live292/fetch_llama292.py . 2>&1 | tee fetch-llama292.log
          du -sh AVDB/Resources/LiveModels/* Vendor/*
      - run: xcodebuild -version
      - name: Neutral preserved gesture, seek, LUT and recommender regressions
        run: |
          set -euo pipefail
          mkdir -p evidence-release
          { python3 scripts/test-watch-history277.py; python3 scripts/test-playback-history.py; python3 scripts/test-progress-tap277.py; python3 scripts/test-player-gestures.py; python3 scripts/test-seek-preview.py; python3 scripts/test-native-lut.py; python3 scripts/test-mediapipe-parity.py; python3 scripts/test-hls-safety273.py; python3 scripts/test-resume-follow280.py; python3 scripts/test-recommender281.py; python3 scripts/test-dmm-covers282.py; python3 scripts/test-tangxin-dns283.py; python3 scripts/test-dmm-covers284.py; python3 scripts/test-ai-cover286.py; python3 scripts/test-player-regressions.py; python3 scripts/test-live289.py; python3 scripts/test-ai-cover289.py; AVDB_CLOUD290_SERVER_OPTIONAL=1 python3 scripts/test-cloud290.py; python3 scripts/test-live291.py; python3 scripts/test-live292.py; python3 scripts/test-live293.py; python3 scripts/test-live294.py; python3 scripts/test-live295.py; python3 scripts/test-live296.py; python3 scripts/test-live297.py; python3 scripts/test-home-hq298.py; python3 scripts/test-search-open299.py; python3 scripts/test-list-hd300.py; python3 scripts/test-category-filter302.py; python3 scripts/test-list-hq-fast303.py; python3 scripts/test-category-filter304.py; python3 scripts/test-category-filter307.py; python3 scripts/test-one308.py; python3 scripts/test-tangxin-full311.py; python3 scripts/test-home-load312.py; python3 scripts/test-zzt-ranking313.py; python3 scripts/test-zzt-ranking314.py; python3 scripts/test-zzt-ranking315.py; python3 scripts/test-zzt-ranking316.py; python3 scripts/test-zzt-ranking317.py; python3 scripts/test-zzt-ranking318.py; python3 scripts/test-zzt-ranking319.py; python3 scripts/test-zzt-ranking320.py; python3 scripts/test-zzt-ranking321.py; python3 scripts/test-zzt-ranking322.py; python3 scripts/test-player-chrome323.py; python3 scripts/test-home-hero-hq326.py; python3 scripts/test-detail-auth327.py; python3 scripts/test-home-hot328.py; python3 scripts/test-home-hot329.py; python3 scripts/test-home-chrome330.py; python3 scripts/test-home-hero331.py; python3 scripts/test-home-hero332.py; python3 scripts/test-home-hero333.py; python3 scripts/test-home-hero334.py; python3 scripts/test-detail-api335.py; python3 scripts/test-remove-javverse336.py; python3 scripts/test-recommender-throttle337.py; python3 scripts/test-logout-access338.py; python3 scripts/test-clear-glass339.py; python3 scripts/test-session-revalidate340.py; python3 scripts/test-reviews-first-load341.py; python3 scripts/test-reviews-panel-pending342.py; python3 scripts/test-list-landscape-cover343.py; python3 scripts/test-list-tabbar-clearance344.py; } 2>&1 | tee evidence-release/regressions.log
      - name: Install actual pinned MediaPipe SDK
        run: |
          gem install cocoapods -v 1.16.2 --no-document
          pod install --repo-update
      - name: Compile production enhancement Metal
        run: |
          xcrun -sdk iphoneos metal -fcikernel -c AVDB/Resources/Enhancement.metal -o "$RUNNER_TEMP/Enhancement.air"
          xcrun -sdk iphoneos metallib -cikernel "$RUNNER_TEMP/Enhancement.air" -o AVDB/Resources/Enhancement.metallib
      - name: Build full production App Release arm64 iOS17 (R2 app key from the AVDB_COVERS_KEY secret → $(AVDB_COVERS_KEY))
        env:
          AVDB_COVERS_KEY: ${{ secrets.AVDB_COVERS_KEY }}
        run: |
          if [ -z "$AVDB_COVERS_KEY" ]; then echo "::warning::AVDB_COVERS_KEY secret missing — IPA will be local-only (no cloud covers)"; fi
          set -euo pipefail
          xcodebuild -workspace AVDB.xcworkspace -scheme AVDB -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/DerivedData" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" CODE_SIGN_ENTITLEMENTS="" ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES=YES clean build 2>&1 | tee evidence-release/xcodebuild.log
      - name: Package actual unsigned App and manifest
        env:
          AVDB_COVERS_KEY: ${{ secrets.AVDB_COVERS_KEY }}
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/AVDB.app"
          /usr/libexec/PlistBuddy -c "Add :AVDBSourceCommit string $GITHUB_SHA" "$app/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :AVDBSourceTree string $(git rev-parse HEAD^{tree})" "$app/Info.plist"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          ditto "$app" "$RUNNER_TEMP/ipa/Payload/AVDB.app"
          python3 scripts/package-lut344.py "$RUNNER_TEMP/ipa" "$GITHUB_WORKSPACE"
          file "$app/AVDB" | tee evidence-release/macho.txt
          xcrun vtool -show-build "$app/AVDB" | tee -a evidence-release/macho.txt
          codesign -dv "$app" 2> evidence-release/codesign.txt || true
      - name: Preserve resolved production dependencies
        if: always()
        run: |
          mkdir -p evidence-release
          cp Podfile.lock evidence-release/Podfile.lock 2>/dev/null || true
          cp "$RUNNER_TEMP/DerivedData/SourcePackages/workspace-state.json" evidence-release/workspace-state.json 2>/dev/null || true
          cp AVDB.xcworkspace/xcshareddata/swiftpm/Package.resolved evidence-release/Package.resolved 2>/dev/null || cp AVDB.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved evidence-release/Package.resolved 2>/dev/null || true
      - name: Assert unsigned IPA exists (prevent empty release artifact)
        run: |
          set -euo pipefail
          ls -lh AVDB-unsigned-*.ipa
          ipa=$(ls AVDB-unsigned-*.ipa | head -1)
          bytes=$(stat -f%z "$ipa")
          echo "ipa=$ipa bytes=$bytes"
          test "$bytes" -gt 500000000
      - uses: actions/upload-artifact@v4
        with:
          name: AVDB-344-release
          path: |
            AVDB-unsigned-*.ipa
            evidence-release/*
            fetch-live289.log
            fetch-llama292.log
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: AVDB-344-release-logs
          path: |
            evidence-release/*
            fetch-live289.log
            fetch-llama292.log
          if-no-files-found: warn
  ai-cover-cloud:
    runs-on: macos-26
    timeout-minutes: 20
    env:
      AVDB_COVERS_KEY: ${{ secrets.AVDB_COVERS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Cloud covers — unit (mock transport), mock Worker over URLSession, real Worker e2e under ci/ (skips without the secret)
        run: |
          set -o pipefail
          mkdir -p evidence-cloud290
          python3 scripts/test-cloud290.py 2>&1 | grep -v -i "warning:" | tee evidence-cloud290/cloud290.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AVDB-344-cloud-tests
          path: evidence-cloud290/*
          if-no-files-found: warn
  ai-cover-settings-screenshots:
