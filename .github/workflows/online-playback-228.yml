name: Build229 Online Playback Native Acceptance
on:
  push:
    branches: [fix/subtitle-position-201]
    paths: ['AVDB/Services/OnlinePlaybackCore.swift', 'AVDB/Services/OnlineAdditionalProviders.swift', 'AVDB/Views/Player/OnlinePlaybackPanel.swift', 'UITests/PosterNavigationTests.swift', '.github/workflows/online-playback-228.yml']
permissions:
  contents: read
concurrency:
  group: online-native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  online:
    runs-on: macos-26
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        device: [iPhone, iPad]
    steps:
      - uses: actions/checkout@v4
      - name: Prepare real app and native scheme
        run: |
          python3 scripts/test-online-playback.py
          gem install cocoapods -v 1.16.2 --no-document
          ruby scripts/setup-poster-uitests.rb
          pod install --repo-update
          xcrun simctl list devices available -j > "$RUNNER_TEMP/devices.json"
          python3 - <<'PY'
          import json,os
          ds=json.load(open(os.environ['RUNNER_TEMP']+'/devices.json'))['devices']
          d=next(d for group in ds.values() for d in group if '${{ matrix.device }}' in d['name'])
          with open(os.environ['GITHUB_ENV'],'a') as f: f.write('DEVICE_ID='+d['udid']+'\n')
          print(d['name'],d['udid'])
          PY
          xcrun -sdk iphonesimulator metal -fcikernel -c AVDB/Resources/Enhancement.metal -o "$RUNNER_TEMP/Enhancement.air"
          xcrun -sdk iphonesimulator metallib -cikernel "$RUNNER_TEMP/Enhancement.air" -o AVDB/Resources/Enhancement.metallib
      - name: Manual six-source panel and real native neutral playback
        run: |
          set -o pipefail
          xcodebuild test -workspace AVDB.xcworkspace -scheme PosterNavigation -configuration Debug -destination "platform=iOS Simulator,id=$DEVICE_ID" -derivedDataPath "$RUNNER_TEMP/OnlineDerived" -resultBundlePath "$RUNNER_TEMP/Online.xcresult" CODE_SIGNING_ALLOWED=NO -parallel-testing-enabled NO -only-testing:PosterNavigationUITests/PosterNavigationTests/testOnlinePlaybackSixSourceManualNativeFlow -only-testing:PosterNavigationUITests/PosterNavigationTests/testOnlinePlaybackAttributedFailures 2>&1 | tee "$RUNNER_TEMP/online.log"
      - name: Export neutral-only actual UI evidence
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/online-evidence/attachments"
          if test -d "$RUNNER_TEMP/Online.xcresult"; then
            xcrun xcresulttool export attachments --path "$RUNNER_TEMP/Online.xcresult" --output-path "$RUNNER_TEMP/online-evidence/attachments"
            xcrun xcresulttool get test-results summary --path "$RUNNER_TEMP/Online.xcresult" --format json > "$RUNNER_TEMP/online-evidence/summary.json"
          fi
          cp "$RUNNER_TEMP/online.log" "$RUNNER_TEMP/online-evidence/" 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build231-online-native-${{ matrix.device }}-${{ github.run_number }}
          path: ${{ runner.temp }}/online-evidence/
          retention-days: 14
