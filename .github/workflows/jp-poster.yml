name: Japanese poster 201 regressions
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/jp-poster.yml']
permissions:
  contents: read
jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        device: [iPhone, iPad]
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Native Swift poster contracts
        run: |
          python3 scripts/test-front-posters.py
          python3 scripts/test-detail-posters.py
          python3 scripts/test-tenhow-posters.py
          python3 scripts/test-dmm-posters.py
      - name: Install test target and dependencies
        run: |
          gem install cocoapods -v 1.16.2 --no-document
          ruby scripts/setup-poster-uitests.rb
          pod install --repo-update
      - name: Choose simulator
        env:
          DEVICE: ${{ matrix.device }}
        run: |
          xcrun simctl list devices available -j > devices.json
          python3 - <<'PY'
          import json,os
          devices=[d for ds in json.load(open('devices.json'))['devices'].values() for d in ds if os.environ['DEVICE'] in d['name']]
          assert devices
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write('SIM_UDID='+devices[0]['udid']+'\n')
          PY
      - name: Compile Metal
        run: |
          xcrun -sdk iphonesimulator metal -fcikernel -c AVDB/Resources/Enhancement.metal -o "$RUNNER_TEMP/Enhancement.air"
          xcrun -sdk iphonesimulator metallib -cikernel "$RUNNER_TEMP/Enhancement.air" -o AVDB/Resources/Enhancement.metallib
      - name: ImageIO and hosted neutral SwiftUI tests
        run: |
          set -o pipefail
          xcodebuild test -workspace AVDB.xcworkspace -scheme PosterNavigation -configuration Debug -destination "platform=iOS Simulator,id=$SIM_UDID" -derivedDataPath "$RUNNER_TEMP/Derived" -resultBundlePath "$RUNNER_TEMP/JapanesePoster.xcresult" CODE_SIGNING_ALLOWED=NO -only-testing:DetailPosterQualityTests/DetailPosterQualityTests -only-testing:DetailPosterQualityTests/Amane022RegressionTests -only-testing:DetailPosterQualityTests/WesternCoverTests -only-testing:PosterNavigationUITests/PosterNavigationTests/testWesternCoverSettingsAndActualFallbackSource -only-testing:PosterNavigationUITests/PosterNavigationTests/testDelayedPosterNeverShowsOldLandscapeAndWarmWinnerIsImmediate -only-testing:PosterNavigationUITests/PosterNavigationTests/testConditionalPortraitHeroRealDetailAndWideFallback 2>&1 | tee "$RUNNER_TEMP/jp-poster.log"
      - name: Export neutral attachments
        if: always()
        run: |
          if test -d "$RUNNER_TEMP/JapanesePoster.xcresult"; then
            xcrun xcresulttool export attachments --path "$RUNNER_TEMP/JapanesePoster.xcresult" --output-path "$RUNNER_TEMP/attachments"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jp-poster-${{ matrix.device }}-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/JapanesePoster.xcresult
            ${{ runner.temp }}/jp-poster.log
            ${{ runner.temp }}/attachments
            devices.json
