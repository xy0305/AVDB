name: Neutral playback diagnostics
on:
  push:
    branches: [fix/subtitle-position-201]
    paths: ['AVDB/Services/OnlinePlaybackCore.swift', 'AVDB/Services/DetailOnlineAdapters.swift', 'scripts/*255*', '.github/workflows/online255.yml']
permissions:
  contents: read
jobs:
  simulator:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Neutral iOS production diagnostics (no online probes or DNS lookups)
        run: |
          set -euo pipefail
          python3 scripts/test-playback-diagnostics257.py --simulator-only | tee online255-ios.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: online255-ios
          path: online255-ios.txt
