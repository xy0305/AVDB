name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26 (iOS 26 SDK / Liquid Glass)
        run: |
          set -euo pipefail
          XCODE=""
          for p in \
            /Applications/Xcode_26.3.app \
            /Applications/Xcode_26.2.app \
            /Applications/Xcode_26.1.1.app \
            /Applications/Xcode_26.0.1.app \
            /Applications/Xcode_26.app; do
            if [ -d "$p" ]; then XCODE="$p"; break; fi
          done
          if [ -z "$XCODE" ]; then
            echo "Xcode 26 not found. Installed:"
            ls /Applications | grep -i xcode || true
            exit 1
          fi
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Install pinned native MediaPipe SDK
        run: |
          gem install cocoapods -v 1.16.2 --no-document
          pod install --repo-update

      - name: Compile simulator Core Image Metal kernel
        run: |
          xcrun -sdk iphonesimulator metal -fcikernel -c AVDB/Resources/Enhancement.metal -o "$RUNNER_TEMP/Enhancement.air"
          xcrun -sdk iphonesimulator metallib -cikernel "$RUNNER_TEMP/Enhancement.air" -o AVDB/Resources/Enhancement.metallib
          python3 scripts/test-ipad-layout.py

      - name: Build (simulator, no signing)
        run: |
          xcodebuild build \
            -workspace AVDB.xcworkspace \
            -scheme AVDB \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO
