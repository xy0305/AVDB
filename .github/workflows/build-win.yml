name: Build Windows EXE

on:
  push:
    branches: [main]
    paths:
      - "win/**"
      - ".github/workflows/build-win.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Publish self-contained WinExe folder
        run: |
          dotnet publish win/AVDB.Win/AVDB.Win.csproj -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=false `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -o win/publish
      - name: Zip package
        run: |
          Compress-Archive -Path win/publish/* -DestinationPath AVDB-win-x64.zip -Force
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AVDB-win-x64
          path: AVDB-win-x64.zip
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: win-${{ github.run_number }}
          name: AVDB Windows ${{ github.run_number }}
          files: AVDB-win-x64.zip
          generate_release_notes: true
