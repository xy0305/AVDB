name: Build IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - fix/subtitle-position-201
    paths:
      - "AVDB/**"
      - "AVDB.xcodeproj/**"
      - "UITests/**"
      - "scripts/missav-fixtures/**"
      - "scripts/tenhow-fixtures/**"
      - ".github/workflows/build-ipa.yml"
      - ".github/workflows/poster-navigation.yml"
      - "scripts/test-*.py"
      - "scripts/GestureRegression.swift"
      - "scripts/SeekPreviewRegression.swift"
      - "scripts/ExternalLibraryRegression.swift"

permissions:
  contents: read

concurrency:
  group: build-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ipa:
    name: Build Release IPA
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show Xcode version
        run: |
          xcodebuild -version
          xcodebuild -showsdks

      - name: Check poster identity, latency and shared regressions
        run: |
          set -euo pipefail
          python3 scripts/test-playback-history.py
          python3 scripts/test-detail-back.py
          python3 scripts/test-catalog-lifecycle.py
          python3 scripts/test-front-posters.py
          python3 scripts/test-detail-posters.py
          python3 scripts/test-tenhow-posters.py
          python3 scripts/test-catalogue-metadata.py
          python3 scripts/test-dmm-posters.py
          python3 scripts/test-poster-latency.py
          python3 scripts/test-poster-provenance.py
          python3 scripts/test-detail-delivery.py | tee detail-delivery-performance.txt
          python3 scripts/test-native-rankings.py
          python3 scripts/test-auth-persistence.py
          python3 scripts/test-external-library.py
          python3 scripts/test-javlibrary.py
          python3 scripts/test-javranking.py
          python3 scripts/test-javranking-mapping.py
          python3 scripts/test-javranking-backend.py
          python3 scripts/test-javranking-design.py
          python3 scripts/test-missav.py
          python3 scripts/test-javranking-performance.py | tee javranking-performance.txt
          python3 scripts/test-ipad-layout.py
          python3 scripts/test-online-subtitles.py
          python3 scripts/test-player-regressions.py
          python3 scripts/test-player-runtime.py
          python3 scripts/test-player-gestures.py
          python3 scripts/test-audio-session.py
          python3 scripts/test-enhancement-pixels.py
          python3 scripts/test-actor-alias243.py
          python3 scripts/test-tmdb-avatar244.py
          python3 scripts/test-javverse244.py

      - name: Integrated production actor regression (195 assertions)
        env:
          ACTOR_REGRESSION: '1'
        run: python3 scripts/actor-live248.py

      - name: Test scrub preview policy and real AVFoundation frames
        run: python3 scripts/test-seek-preview.py

      - name: Test native 115 RSA protocol
        run: python3 scripts/test-115-native.py

      - name: Test native LUT cube and search
        run: |
          python3 scripts/test-native-lut.py
          python3 scripts/test-mediapipe-parity.py

      - name: Install pinned native MediaPipe SDK
        run: |
          gem install cocoapods -v 1.16.2 --no-document
          pod install --repo-update

      - name: Compile independent Core Image Metal kernel
        run: |
          xcrun -sdk iphoneos metal -fcikernel -c AVDB/Resources/Enhancement.metal -o "$RUNNER_TEMP/Enhancement.air"
          xcrun -sdk iphoneos metallib -cikernel "$RUNNER_TEMP/Enhancement.air" -o AVDB/Resources/Enhancement.metallib

      - name: Build unsigned (iphoneos)
        run: |
          set -euo pipefail
          xcodebuild \
            -workspace AVDB.xcworkspace \
            -scheme AVDB \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES=YES \
            clean build \
            | tee "$RUNNER_TEMP/xcodebuild.log"

      - name: Real Release Bundle schema (not fixture)
        run: python3 scripts/test-javverse247.py "$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/AVDB.app/JavVerseSnapshot.json"

      - name: Probe optional third-party with system URLSession TLS
        continue-on-error: true
        run: SUBTITLE_LIVE_PROBE=1 python3 scripts/test-online-subtitles.py

      - name: Package IPA
        run: |
          set -euo pipefail
          app_path="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/AVDB.app"
          test -d "$app_path"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          ditto "$app_path" "$RUNNER_TEMP/ipa/Payload/AVDB.app"
          find "$RUNNER_TEMP/ipa/Payload" -name '*.xcent' -delete
          find "$RUNNER_TEMP/ipa/Payload" -name 'embedded.mobileprovision' -delete
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app_path/Info.plist")
          build=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app_path/Info.plist")
          ipa_name="AVDB-unsigned-${version}-${build}.ipa"
          cd "$RUNNER_TEMP/ipa"
          zip -qry "$GITHUB_WORKSPACE/$ipa_name" Payload
          echo "IPA_NAME=$ipa_name" >> "$GITHUB_ENV"

      - name: Record actual resolved dependency versions
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          paths = [Path('AVDB.xcworkspace/xcshareddata/swiftpm/Package.resolved'), Path('AVDB.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved'), Path(os.environ['RUNNER_TEMP'])/'DerivedData/SourcePackages/workspace-state.json']
          for p in paths:
              if p.exists():
                  print(str(p)); print(p.read_text())
          PY

      - name: Upload actual Release schema evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: javverse-release-schema247
          path: schema247.json

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: AVDB-unsigned-${{ github.run_number }}
          path: AVDB-unsigned-*.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload source performance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: javranking-performance-${{ github.run_number }}
          path: |
            javranking-performance.txt
            detail-delivery-performance.txt
          if-no-files-found: ignore

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log-${{ github.run_number }}
          path: ${{ runner.temp }}/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7
