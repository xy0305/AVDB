name: Build IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "AVDB/**"
      - "AVDB.xcodeproj/**"
      - ".github/workflows/build-ipa.yml"

permissions:
  contents: read

concurrency:
  group: build-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ipa:
    name: Build Release IPA
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: |
          xcodebuild -version
          xcodebuild -showsdks

      - name: Check LUT timeout and sheet lifecycle regressions
        run: python3 scripts/test-player-regressions.py

      - name: Test native 115 RSA protocol
        run: python3 scripts/test-115-native.py

      - name: Test native LUT cube and search
        run: |
          python3 scripts/test-native-lut.py
          python3 scripts/test-mediapipe-parity.py

      - name: Install pinned native MediaPipe SDK
        run: |
          gem install cocoapods -v 1.16.2 --no-document
          pod install --repo-update

      - name: Build unsigned (iphoneos)
        run: |
          set -euo pipefail
          xcodebuild \
            -workspace AVDB.xcworkspace \
            -scheme AVDB \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES=YES \
            clean build \
            | tee "$RUNNER_TEMP/xcodebuild.log"

      - name: Package IPA
        run: |
          set -euo pipefail
          app_path="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/AVDB.app"
          test -d "$app_path"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          ditto "$app_path" "$RUNNER_TEMP/ipa/Payload/AVDB.app"
          find "$RUNNER_TEMP/ipa/Payload" -name '*.xcent' -delete
          find "$RUNNER_TEMP/ipa/Payload" -name 'embedded.mobileprovision' -delete
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app_path/Info.plist")
          build=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app_path/Info.plist")
          ipa_name="AVDB-unsigned-${version}-${build}.ipa"
          cd "$RUNNER_TEMP/ipa"
          zip -qry "$GITHUB_WORKSPACE/$ipa_name" Payload
          echo "IPA_NAME=$ipa_name" >> "$GITHUB_ENV"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: AVDB-unsigned-${{ github.run_number }}
          path: AVDB-unsigned-*.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log-${{ github.run_number }}
          path: ${{ runner.temp }}/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7
