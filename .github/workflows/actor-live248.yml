name: ActorLive248
on:
  push:
    branches: [fix/subtitle-position-201]
    paths: ['scripts/actor-probe249.py', 'scripts/ActorProbe249.swift', '.github/workflows/actor-live248.yml']
permissions:
  contents: read
jobs:
  metadata:
    runs-on: macos-26
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Compile actual production SDK and probe screenshot actor text metadata only
        run: python3 scripts/actor-probe249.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: actor-probe249
          path: actor-probe249.json
          retention-days: 14
