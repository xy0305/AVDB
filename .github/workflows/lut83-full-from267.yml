name: LUT83 full from 267 neutral native and unsigned IPA
on:
  push:
    branches: [feat/lut83-full-from267]
    paths:
      - AVDB/**
      - AVDB.xcodeproj/**
      - scripts/**
      - Build278-AvbaseHQImages.md
      - .github/workflows/lut83-full-from267.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  neutral-native:
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Real macOS JavaScriptCore CoreImage plus inherited neutral regressions
        run: |
          set -euo pipefail
          mkdir -p evidence-lut83
          { python3 scripts/test-native-lut.py; node scripts/test-lut83-full.js AVDB/Resources/OriginalLUT.js; python3 scripts/test-lut83-full-jsc.py; python3 scripts/test-enhancement-pixels.py; python3 scripts/test-seek-preview.py; python3 scripts/test-progress-tap277.py; } 2>&1 | tee evidence-lut83/macos.log
      - name: Isolated iOS simulator production LUT controller and local neutral media
        run: |
          set -euo pipefail
          gem install xcodeproj cocoapods --no-document
          python3 scripts/test-lut83-simulator.py > evidence-lut83/simulator.log 2>&1 || { tail -120 evidence-lut83/simulator.log; exit 1; }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lut83-neutral-native-evidence
          path: |
            evidence-lut83/*.log
            evidence-lut83/result.json
            evidence-lut83/native-panel.png
  release:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Avbase HQ cover and portrait contracts
        run: |
          python3 scripts/test-catalogue-metadata.py
          python3 scripts/test-avbase-portraits278.py
          python3 scripts/test-list-hq-covers275.py
      - name: Install existing pinned dependency only
        run: |
          gem install cocoapods -v 1.16.2 --no-document
          pod install --repo-update
      - name: Build SDR kernel and unsigned arm64 Release
        run: |
          set -euo pipefail
          xcrun -sdk iphoneos metal -fcikernel -c AVDB/Resources/Enhancement.metal -o /tmp/Enhancement.air
          xcrun -sdk iphoneos metallib -cikernel /tmp/Enhancement.air -o AVDB/Resources/Enhancement.metallib
          xcodebuild -workspace AVDB.xcworkspace -scheme AVDB -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath /tmp/lut83-release CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' CODE_SIGN_ENTITLEMENTS='' build > /tmp/lut83-release.log 2>&1 || { tail -120 /tmp/lut83-release.log; exit 1; }
          APP=/tmp/lut83-release/Build/Products/Release-iphoneos/AVDB.app
          /usr/libexec/PlistBuddy -c "Add :AVDBSourceCommit string $GITHUB_SHA" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :AVDBSourceTree string $(git rev-parse HEAD^{tree})" "$APP/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist")" = 268
          lipo -info "$APP/AVDB"
          if codesign -dv "$APP" 2>/dev/null; then exit 1; fi
          mkdir -p /tmp/lut83-package/Payload
          ditto "$APP" /tmp/lut83-package/Payload/AVDB.app
          cd /tmp/lut83-package
          zip -qry "$GITHUB_WORKSPACE/AVDB-unsigned-1.0.2-268-full-lut83-from267.ipa" Payload
      - uses: actions/upload-artifact@v4
        with:
          name: AVDB-unsigned-1.0.2-268-full-lut83-from267
          path: '*.ipa'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lut83-release-build-log
          path: /tmp/lut83-release.log
