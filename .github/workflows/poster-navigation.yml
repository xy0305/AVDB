name: iPad Poster Navigation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['AVDB/Views/Detail/**', 'AVDB/Services/DetailPoster*.swift', 'AVDB/Services/Tenhow*.swift', 'scripts/test-dmm-posters.py', 'scripts/test-poster-latency.py', 'scripts/test-detail-posters.py', 'AVDB/Views/Categories/**', 'AVDB/Services/MovieListViewModel.swift', 'AVDB/Networking/APIClient.swift', 'scripts/test-catalog-lifecycle.py', 'scripts/CatalogLifecycleRegression.swift', 'UITests/**', 'AVDB/Views/Home/**', 'AVDB/Views/JavRankingView.swift', 'AVDB/Views/JAVLibraryRankingView.swift', 'AVDB/Services/JAVLibrarySource.swift', 'AVDB/Views/MissAVRankingView.swift', 'AVDB/Views/Rankings/**', 'AVDB/Services/MissAV*.swift', 'AVDB/Views/ContentView.swift', 'AVDB/Views/Components/JAVDBUI.swift', 'AVDB/Services/ImageLoader.swift', 'AVDB/Services/JavDBSDK.swift', 'AVDB/Models/**', 'scripts/test-native-rankings.py', 'scripts/RankingsRegression.swift', 'scripts/setup-poster-uitests.rb', 'scripts/test-player-regressions.py', 'AVDB/Views/Player/OnlineSubtitle.swift', 'scripts/test-online-subtitles.py', 'scripts/OnlineSubtitleRegression.swift', '.github/workflows/poster-navigation.yml']
jobs:
  navigation:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies and test scheme
        run: |
          gem install cocoapods -v 1.16.2 --no-document
          ruby scripts/setup-poster-uitests.rb
          pod install --repo-update
      - name: Choose available iPad simulator
        run: |
          xcrun simctl list devices available -j > devices.json
          python3 - <<'PY'
          import json,os
          devices=json.load(open('devices.json'))['devices']
          pads=[d for ds in devices.values() for d in ds if 'iPad' in d['name']]
          assert pads, 'No available iPad simulator'
          chosen=next((d for d in pads if '13-inch' in d['name']), pads[0])
          print(chosen)
          with open(os.environ['GITHUB_ENV'],'a') as f: f.write('IPAD_UDID='+chosen['udid']+'\n')
          phones=[d for ds in devices.values() for d in ds if 'iPhone' in d['name']]
          assert phones, 'No available iPhone simulator'
          chosen=phones[0]
          print(chosen)
          with open(os.environ['GITHUB_ENV'],'a') as f: f.write('IPHONE_UDID='+chosen['udid']+'\n')
          PY
      - name: Execute production catalog lifecycle regression
        run: python3 scripts/test-catalog-lifecycle.py
      - name: Execute MissAV parser and account metadata regression
        run: |
          python3 scripts/test-missav.py
          python3 scripts/test-missav-metadata.py
      - name: Execute production native ranking regression
        run: python3 scripts/test-native-rankings.py
      - name: Execute production detail poster regression
        run: |
          python3 scripts/test-detail-posters.py
          python3 scripts/test-dmm-posters.py
          python3 scripts/test-poster-latency.py
      - name: Compile simulator Metal resource
        run: |
          xcrun -sdk iphonesimulator metal -fcikernel -c AVDB/Resources/Enhancement.metal -o "$RUNNER_TEMP/Enhancement.air"
          xcrun -sdk iphonesimulator metallib -cikernel "$RUNNER_TEMP/Enhancement.air" -o AVDB/Resources/Enhancement.metallib
      - name: Tap visible Home latest covers in narrow and wide windows
        run: |
          set -o pipefail
          xcodebuild test -workspace AVDB.xcworkspace -scheme PosterNavigation -configuration Debug -destination "platform=iOS Simulator,id=$IPAD_UDID" -derivedDataPath "$RUNNER_TEMP/PosterDerived" -resultBundlePath "$RUNNER_TEMP/PosterNavigation.xcresult" CODE_SIGNING_ALLOWED=NO -only-testing:PosterNavigationUITests/PosterNavigationTests -only-testing:DetailPosterQualityTests/DetailPosterQualityTests -only-testing:DetailPosterQualityTests/OnlineSubtitleModelTests 2>&1 | tee "$RUNNER_TEMP/poster-navigation.log"
      - name: Recent magnet production catalog on iPhone
        if: success() || failure()
        run: |
          set -o pipefail
          xcodebuild test -workspace AVDB.xcworkspace -scheme PosterNavigation -configuration Debug -destination "platform=iOS Simulator,id=$IPHONE_UDID" -derivedDataPath "$RUNNER_TEMP/PosterDerived" -resultBundlePath "$RUNNER_TEMP/PhoneCatalog.xcresult" CODE_SIGNING_ALLOWED=NO -only-testing:PosterNavigationUITests/PosterNavigationTests/testLongDetailTitleNeverCoversArtworkAndExpands -only-testing:PosterNavigationUITests/PosterNavigationTests/testAccessibleDetailTitleAndLandscapeActions -only-testing:PosterNavigationUITests/PosterNavigationTests/testOnlineSubtitleConsentSelectionOffsetAndDisable -only-testing:PosterNavigationUITests/PosterNavigationTests/testMissAVPagedReturnPreservesMovieOffsetAndQuery -only-testing:PosterNavigationUITests/PosterNavigationTests/testMissAVSwitchCancelsOldPagination -only-testing:PosterNavigationUITests/PosterNavigationTests/testRecentMagnetCatalogRealViewReturnWithoutReload -only-testing:PosterNavigationUITests/PosterNavigationTests/testConditionalPortraitHeroRealDetailAndWideFallback -only-testing:PosterNavigationUITests/PosterNavigationTests/testDelayedPosterNeverShowsOldLandscapeAndWarmWinnerIsImmediate -only-testing:DetailPosterQualityTests/DetailPosterQualityTests -only-testing:DetailPosterQualityTests/OnlineSubtitleModelTests 2>&1 | tee "$RUNNER_TEMP/phone-catalog.log"
      - name: Export neutral screenshots
        if: always()
        run: |
          if test -d "$RUNNER_TEMP/PosterNavigation.xcresult"; then
            xcrun xcresulttool export attachments --path "$RUNNER_TEMP/PosterNavigation.xcresult" --output-path "$RUNNER_TEMP/poster-screenshots"
          fi
          if test -d "$RUNNER_TEMP/PhoneCatalog.xcresult"; then
            xcrun xcresulttool export attachments --path "$RUNNER_TEMP/PhoneCatalog.xcresult" --output-path "$RUNNER_TEMP/phone-catalog-screenshots"
          fi
      - name: Upload screenshots hierarchy and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ipad-poster-navigation-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/PosterNavigation.xcresult
            ${{ runner.temp }}/poster-screenshots
            ${{ runner.temp }}/poster-navigation.log
            ${{ runner.temp }}/phone-catalog.log
            ${{ runner.temp }}/phone-catalog-screenshots
            ${{ runner.temp }}/PhoneCatalog.xcresult
            devices.json
