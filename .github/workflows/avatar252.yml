name: AvatarDiagnostics252
on:
  push:
    branches: [fix/subtitle-position-201]
    paths: ['scripts/*252*', '.github/workflows/avatar252.yml', 'AVDB/Services/JavBusActorAvatar.swift']
permissions:
  contents: read
jobs:
  native:
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Production API identity and no-cookie redirect diagnostics
        run: |
          set -euo pipefail
          python3 scripts/avatar-identity252.py 2>&1 | tee avatar-identity252.log
          swiftc -parse-as-library scripts/LocationProbe252.swift -o /tmp/location252
          /tmp/location252 2>&1 | tee location252.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: avatar-diagnostics252
          path: |
            avatar-identity252.json
            avatar-identity252.log
            location252.log
          retention-days: 14
