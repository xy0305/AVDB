name: AvatarDiagnostics252
on:
  push:
    branches: [fix/subtitle-position-201]
    paths: ['scripts/*252*', '.github/workflows/avatar252.yml', 'AVDB/Services/JavBusActorAvatar.swift']
permissions:
  contents: read
jobs:
  native:
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Production API identity and no-cookie redirect diagnostics
        run: |
          set -euo pipefail
          python3 scripts/avatar-identity252.py 2>&1 | tee avatar-identity252.log
          JAVBUS_LIVE_PROBE=1 python3 scripts/test-javbus-actors251.py 2>&1 | tee avatar-regression252.log
          ACTOR_REGRESSION=1 python3 scripts/actor-live248.py 2>&1 | tee actor-regression252.log
          python3 scripts/test-actor-avatar243.py
          python3 scripts/test-javverse247.py
          swiftc -parse-as-library scripts/LocationProbe252.swift -o /tmp/location252
          /tmp/location252 2>&1 | tee location252.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: avatar-diagnostics252
          path: |
            avatar-identity252.json
            avatar-identity252.log
            location252.log
            avatar-regression252.log
            actor-regression252.log
            javbus-native252.json
            native-portrait252.jpg
          retention-days: 14
